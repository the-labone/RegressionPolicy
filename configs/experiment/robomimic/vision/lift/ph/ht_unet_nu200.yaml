# @package _global_
defaults:
- /experiment/robomimic/_base/vision/ht_unet
- _self_
name: lift_ph_visual_ht_c_nu200_s41
dataloader:
  train:
    num_workers: 4
    persistent_workers: true
  validation:
    num_workers: 2
    persistent_workers: true
seed: 41
dataset:
  source_action_space: abs
  normalization: minmax
policy:
  model:
    down_dims:
    - 512
    - 1024
    - 2048
    diffusion_step_embed_dim: 128
  action_start_index: 1
training:
  device: cuda:0
  allow_tf32: true
  evaluation_seed: ${seed}
  compile:
    enabled: true
  trainer:
    max_steps: 1016000
    validate_every: 127
    eval_every: 6350
    checkpoint_every: 6350
    log_every: 10
evaluation:
  source_robosuite_version: 1.2.0
  render_hw:
  - 84
  - 84
  n_train: 6
  n_test: 50
  n_envs: 28
  num_workers: 8
  n_train_vis: 2
  n_test_vis: 4
  test_start_seed: 100000
  max_steps: 400
