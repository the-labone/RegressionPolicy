<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 472" width="640" height="472" role="img" aria-labelledby="correlation-story-description" font-family="Source Sans Pro, Arial, sans-serif">
  <title id="correlation-story-description">Residual fit correlates with policy success</title>
  <desc>Eight training objectives on RoboCasa-GR1. Marker positions and horizontal confidence intervals are reproduced from the paper figure. Spearman correlation is 0.86 and Pearson correlation is 0.83. The dashed line is a linear fit across the eight objectives.</desc>
  <metadata>Source: residual-correlation-web.svg; extracted by scripts/render_correlation_story.py. X: calibrated mean joint log-likelihood per action dimension (nat/dim). Intervals: 2000 task-stratified episode bootstrap samples with fitted scale fixed. SVG coordinate precision only.</metadata>
